[project]
name = "nearfar-relation-tensor-asd"
version = "0.1.0"
description = "Localized near/far relation tensor residual evidence for low-support dual-channel anomalous sound detection."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
  "soundfile>=0.12",
  "librosa>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
